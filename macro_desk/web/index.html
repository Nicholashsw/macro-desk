<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Macro Desk Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117; --panel: #151b23; --line: #263040; --text: #e6edf3; --muted: #8b98a8;
    --accent: #f2b33d; --up: #3fb950; --down: #f85149; --wire: #79c0ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 "IBM Plex Sans", system-ui, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 28px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); padding-bottom: 14px; }
  h1 { font: 600 20px "IBM Plex Sans"; margin: 0; letter-spacing: .02em; }
  h1 span { color: var(--accent); }
  .status { font: 12px "IBM Plex Mono", monospace; color: var(--muted); }
  .status b { color: var(--up); font-weight: 500; }
  .grid { display: grid; grid-template-columns: 1.15fr .85fr; gap: 16px; margin-top: 20px; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
  .label { font: 500 11px "IBM Plex Mono", monospace; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 8px; }
  .ask { display: flex; gap: 8px; }
  .ask input { flex: 1; min-width: 0; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; font: inherit; }
  .ask input:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
  button { cursor: pointer; border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 6px; padding: 0 14px; font: 500 14px "IBM Plex Sans"; }
  button:hover { border-color: var(--accent); }
  #mic { width: 44px; display: grid; place-items: center; padding: 0; }
  #mic.on { background: var(--accent); color: #111; border-color: var(--accent); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(242,179,61,.18); } }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chips button { height: 28px; font-size: 12.5px; color: var(--muted); }
  .chips button:hover { color: var(--text); }
  .answer { margin-top: 18px; min-height: 120px; }
  .you { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
  .say { font-size: 17px; line-height: 1.6; }
  .say.err { color: var(--down); }
  .metrics { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .metric { border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font: 12px "IBM Plex Mono", monospace; }
  .metric em { font-style: normal; color: var(--muted); margin-right: 6px; }
  .z-hi { color: var(--accent); } .z-lo { color: var(--text); }
  pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: 11.5px/1.5 "IBM Plex Mono", monospace; color: var(--wire); max-height: 460px; overflow: auto; }
  .dir { color: var(--muted); }
  footer { margin-top: 18px; color: var(--muted); font-size: 12px; }
  a { color: var(--wire); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Macro <span>Desk</span></h1>
    <div class="status" id="status">connecting…</div>
  </header>

  <div class="grid">
    <section class="panel">
      <div class="label">Ask</div>
      <form class="ask" id="form">
        <button type="button" id="mic" title="Hold a question in your voice" aria-label="Speak">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
        <input id="q" autocomplete="off" placeholder="How did the jobs report look?">
        <button type="submit">Ask</button>
      </form>
      <div class="chips" id="chips"></div>

      <div class="answer">
        <div class="you" id="you"></div>
        <div class="say" id="say">Ask about inflation, jobs, growth, rates or the yield curve.</div>
        <div class="metrics" id="metrics"></div>
      </div>
    </section>

    <section class="panel">
      <div class="label">MCP wire · Streamable HTTP</div>
      <pre id="wire"><span class="dir">waiting for first call</span></pre>
    </section>
  </div>
  <footer>Data from FRED, Federal Reserve Bank of St. Louis. Shock scores are z-scores of each release against its prior three years.</footer>
</main>

<script>
const PROTOCOL = "2025-11-25";
const $ = (id) => document.getElementById(id);
let rpcId = 0;

async function rpc(method, params = {}) {
  const body = { jsonrpc: "2.0", id: ++rpcId, method, params };
  const res = await fetch("/mcp", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Accept": "application/json, text/event-stream",
               "MCP-Protocol-Version": PROTOCOL },
    body: JSON.stringify(body),
  });
  const text = await res.text();
  const msg = res.headers.get("content-type").startsWith("text/event-stream")
    ? JSON.parse(text.split("\n").filter(l => l.startsWith("data:")).pop().slice(5))
    : JSON.parse(text);
  return { body, msg };
}

async function connect() {
  try {
    const { msg } = await rpc("initialize", { protocolVersion: PROTOCOL, capabilities: {},
                                              clientInfo: { name: "macro-desk-console", version: "0.1.0" } });
    const tools = await rpc("tools/list");
    $("status").innerHTML = `<b>●</b> ${msg.result.serverInfo.title} · MCP ${msg.result.protocolVersion} · ${tools.msg.result.tools.length} tools`;
  } catch (e) {
    $("status").textContent = "server unreachable";
  }
}

// The console stands in for Alexa+: pick a tool from the utterance, pass the words through,
// and let the server's own resolver map phrases like "the jobs report" to a series.
function route(q) {
  const s = q.toLowerCase();
  if (/(brief|rundown|overview|update|what'?s (going on|happening)|how'?s the economy)/.test(s)) return ["macro_briefing", {}];
  if (/(curve|invert|recession signal|term spread)/.test(s)) return ["yield_curve", {}];
  if (/(regime|big picture|stagflation|goldilocks|reflation|where are we in the cycle)/.test(s)) return ["macro_regime", {}];
  if (/(unusual|surprise|shock|how big|a lot|normal|z.?score|outlier)/.test(s)) return ["shock_score", { indicator: q }];
  if (/(what can you|which indicators|what do you track)/.test(s)) return ["list_indicators", {}];
  return ["get_indicator", { indicator: q }];
}

function speak(text) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 1.03;
  speechSynthesis.speak(u);
}

function metrics(payload) {
  const out = [];
  const r = payload.reading;
  if (r) {
    out.push(["value", r.value?.toFixed(2)]);
    if (r.z_score != null) out.push(["z", r.z_score.toFixed(2), Math.abs(r.z_score) >= 1 ? "z-hi" : "z-lo"]);
    out.push(["pctile", Math.round(r.percentile)]);
    out.push(["period", r.period]);
  }
  if (payload.curve && !payload.movers) {
    const c = payload.curve;
    out.push(["3m", c.y3m], ["2y", c.y2y], ["10y", c.y10y], ["10y-3m", `${c.spread_10y_3m_bp}bp`]);
  }
  if (payload.movers) payload.movers.forEach(m => out.push([m.indicator, `z ${m.z_score}`, Math.abs(m.z_score) >= 1 ? "z-hi" : "z-lo"]));
  if (payload.regime && typeof payload.regime === "string") out.push(["regime", payload.regime]);
  if (payload.data_source) out.push(["source", payload.data_source]);
  $("metrics").innerHTML = out.map(([k, v, cls]) => `<span class="metric ${cls || ""}"><em>${k}</em>${v}</span>`).join("");
}

async function ask(q) {
  q = q.trim();
  if (!q) return;
  $("you").textContent = `“${q}”`;
  $("say").className = "say";
  $("say").textContent = "…";
  $("metrics").innerHTML = "";
  const [name, args] = route(q);
  const { body, msg } = await rpc("tools/call", { name, arguments: args });
  const shown = structuredClone(msg);
  try { shown.result.content[0].text = JSON.parse(shown.result.content[0].text); } catch (_) {}
  $("wire").textContent = "→ " + JSON.stringify(body, null, 2) + "\n\n← " + JSON.stringify(shown, null, 2);
  const result = msg.result || {};
  const text = result.content?.[0]?.text || msg.error?.message || "No answer.";
  if (result.isError || msg.error) {
    $("say").className = "say err";
    $("say").textContent = text.replace(/^Error executing tool \w+: /, "");
    speak($("say").textContent);
    return;
  }
  const payload = result.structuredContent || JSON.parse(text);
  $("say").textContent = payload.speech;
  metrics(payload);
  speak(payload.speech);
}

$("form").addEventListener("submit", (e) => { e.preventDefault(); ask($("q").value); });

["Brief me on the economy", "What was inflation last month?", "Was that CPI print unusual?",
 "How's the jobs report?", "Is the yield curve inverted?", "What regime are we in?"]
  .forEach(t => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = t;
    b.onclick = () => { $("q").value = t; ask(t); };
    $("chips").appendChild(b);
  });

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR) {
  const rec = new SR();
  rec.lang = "en-US"; rec.interimResults = true;
  rec.onresult = (e) => {
    const t = Array.from(e.results).map(r => r[0].transcript).join("");
    $("q").value = t;
    if (e.results[e.results.length - 1].isFinal) ask(t);
  };
  rec.onend = () => $("mic").classList.remove("on");
  $("mic").onclick = () => { speechSynthesis.cancel(); $("mic").classList.add("on"); rec.start(); };
} else {
  $("mic").disabled = true;
  $("mic").title = "Voice input needs Chrome or Edge";
}

connect();
</script>
</body>
</html>
