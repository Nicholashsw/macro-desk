[project]
name = "macro-desk"
version = "0.1.0"
description = "Voice-first US macro and rates briefings over MCP, built for Alexa+."
readme = "README.md"
license = "MIT"
authors = [{ name = "Nicholas Hong" }]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2,<3",
    "pandas>=2.2",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
sonos = ["soco>=0.30"]

[project.scripts]
macro-desk = "macro_desk.server:main"
macro-desk-sonos = "macro_desk.sonos_cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["macro_desk*"]

[tool.setuptools.package-data]
macro_desk = ["data/*.csv", "web/*.html", "web/assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
